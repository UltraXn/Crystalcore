name: CI | Java Plugin

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  java-qa:
    name: Build & Verify (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & Test with Maven
        run: mvn -B -f pom.xml clean test package
